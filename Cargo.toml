[workspace]
resolver = "3"
members = ["crates/engine", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "stream"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
regex = "1.13.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "clock", "std"] }
